<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Horas — Cuidadora</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F7F4EF;
  --surface: #FFFFFF;
  --accent: #C4714A;
  --accent-light: #F5E8E0;
  --text: #1A1510;
  --muted: #7A6E65;
  --border: #E2DDD8;
  --success-bg: #EAF3E0; --success: #3B6D11;
  --error-bg: #FCE8E8;   --error: #A32D2D;
  --info-bg: #EAF1FB;    --info: #185FA5;
  --radius: 14px; --radius-sm: 8px;
}
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 2.5rem 1rem 5rem;
}
.container { width: 100%; max-width: 480px; }
h1 {
  font-family: 'DM Serif Display', serif;
  font-size: 2rem; font-weight: 400;
  margin-bottom: 4px;
}
.subtitle { font-size: 14px; color: var(--muted); margin-bottom: 2rem; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
  margin-bottom: 1rem;
}
.user-bar {
  background: var(--accent-light);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 1.5rem;
}
.avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--accent); color: white;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 500; flex-shrink: 0;
}
.user-info .name { font-size: 14px; font-weight: 500; }
.user-info .email { font-size: 12px; color: var(--muted); }
label {
  display: block;
  font-size: 11px; font-weight: 500;
  letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 6px;
}
input[type="date"], input[type="number"], textarea {
  width: 100%; padding: 10px 12px;
  font-size: 15px; font-family: 'DM Sans', sans-serif;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--bg); color: var(--text);
  outline: none; transition: border-color 0.15s;
}
input:focus, textarea:focus { border-color: var(--accent); }
textarea { resize: vertical; line-height: 1.6; }
.field { margin-bottom: 1.25rem; }
.btn {
  width: 100%; padding: 12px;
  background: var(--accent); color: white;
  border: none; border-radius: var(--radius-sm);
  font-size: 15px; font-weight: 500;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer; transition: opacity 0.15s, transform 0.1s;
}
.btn:hover { opacity: 0.88; }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-google {
  width: 100%; padding: 11px;
  background: white; border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 15px; font-family: 'DM Sans', sans-serif;
  cursor: pointer; display: flex; align-items: center;
  justify-content: center; gap: 10px;
  transition: background 0.15s;
}
.btn-google:hover { background: var(--bg); }
.btn-sm {
  padding: 5px 12px; font-size: 12px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: transparent; color: var(--muted);
  cursor: pointer; font-family: 'DM Sans', sans-serif;
}
.btn-sm:hover { background: var(--bg); }
.msg {
  border-radius: var(--radius-sm);
  padding: 11px 14px; font-size: 14px;
  margin-bottom: 1rem; display: none; line-height: 1.5;
}
.msg.success { background: var(--success-bg); color: var(--success); }
.msg.error   { background: var(--error-bg);   color: var(--error);   }
.msg.info    { background: var(--info-bg);     color: var(--info);    }
.section-label {
  font-size: 11px; font-weight: 500;
  letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 8px;
}
.entry {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 14px; margin-bottom: 6px;
}
.entry-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.entry-date { font-size: 14px; font-weight: 500; }
.entry-hours { font-size: 13px; color: var(--accent); font-weight: 500; }
.entry-comment { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry-ts { font-size: 11px; color: #B0A89E; margin-top: 4px; }
#login-section {}
#app-section { display: none; }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.4); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
  <h1>Registro de horas</h1>
  <p class="subtitle">Cuidado de abuela</p>

  <!-- LOGIN -->
  <div id="login-section">
    <div class="card">
      <p style="font-size:14px;color:var(--muted);margin-bottom:1rem;line-height:1.6">
        Iniciá sesión con tu cuenta de Google para registrar las horas y sincronizar automáticamente con Google Sheets.
      </p>
      <button class="btn-google" onclick="window.location.href='/auth/login'">
        <svg width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/>
          <path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/>
          <path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"/>
          <path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.3z"/>
        </svg>
        Iniciar sesión con Google
      </button>
    </div>
  </div>

  <!-- APP -->
  <div id="app-section">
    <div class="user-bar">
      <div class="avatar" id="avatar">C</div>
      <div class="user-info" style="flex:1">
        <div class="name" id="uname">Cuidadora</div>
        <div class="email" id="uemail"></div>
      </div>
      <button class="btn-sm" onclick="logout()">Salir</button>
    </div>

    <div class="card">
      <div class="field">
        <label>Fecha</label>
        <input type="date" id="fecha">
      </div>
      <div class="field">
        <label>Horas trabajadas</label>
        <input type="number" id="horas" min="0" max="24" step="0.5" placeholder="Ej: 8">
      </div>
      <div class="field" style="margin-bottom:1.5rem">
        <label>Comentario del día</label>
        <textarea id="comentario" rows="4" placeholder="¿Cómo fue el día? Medicamentos, estado de ánimo, novedades..."></textarea>
      </div>
      <button class="btn" id="guardar-btn" onclick="guardar()">Guardar registro</button>
    </div>

    <div id="msg" class="msg"></div>

    <div id="recientes" style="display:none">
      <p class="section-label">Últimos registros</p>
      <div id="lista"></div>
    </div>
  </div>
</div>

<script>
let token = null;

function setHoy(){
  const d = new Date();
  document.getElementById('fecha').value = d.toISOString().split('T')[0];
}

function showMsg(txt, tipo){
  const el = document.getElementById('msg');
  el.textContent = txt; el.className = 'msg ' + tipo;
  el.style.display = 'block';
  if(tipo === 'success') setTimeout(()=>el.style.display='none', 4000);
}

function logout(){
  token = null;
  sessionStorage.removeItem('gtoken');
  document.getElementById('app-section').style.display = 'none';
  document.getElementById('login-section').style.display = 'block';
  document.getElementById('msg').style.display = 'none';
}

async function initApp(t){
  token = t;
  sessionStorage.setItem('gtoken', t);
  const r = await fetch('/auth/userinfo?access_token=' + t);
  if(!r.ok){ logout(); return; }
  const user = await r.json();
  const initials = (user.name||'C').split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();
  document.getElementById('avatar').textContent = initials;
  document.getElementById('uname').textContent = user.name || 'Cuidadora';
  document.getElementById('uemail').textContent = user.email || '';
  document.getElementById('login-section').style.display = 'none';
  document.getElementById('app-section').style.display = 'block';
  setHoy();
  cargarRegistros();
}

async function guardar(){
  const fecha = document.getElementById('fecha').value;
  const horas = document.getElementById('horas').value;
  const comentario = document.getElementById('comentario').value.trim();
  if(!fecha || !horas){ showMsg('Completá la fecha y las horas trabajadas.', 'error'); return; }
  if(parseFloat(horas) <= 0 || parseFloat(horas) > 24){ showMsg('Las horas deben estar entre 0 y 24.', 'error'); return; }

  const btn = document.getElementById('guardar-btn');
  btn.innerHTML = '<span class="spinner"></span>Guardando...';
  btn.disabled = true;

  try {
    const r = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fecha, horas: parseFloat(horas), comentario })
    });
    if(!r.ok){
      const e = await r.json();
      throw new Error(e.detail || 'Error desconocido');
    }
    const data = await r.json();
    showMsg('Registro guardado en Google Sheets — ' + data.registrado, 'success');
    document.getElementById('horas').value = '';
    document.getElementById('comentario').value = '';
    setHoy();
    cargarRegistros();
  } catch(e){
    showMsg('Error: ' + e.message, 'error');
  }

  btn.innerHTML = 'Guardar registro';
  btn.disabled = false;
}

async function cargarRegistros(){
  try {
    const r = await fetch('/api/registers');
    if(!r.ok) return;
    const entries = await r.json();
    if(entries.length === 0) return;
    document.getElementById('recientes').style.display = 'block';
    document.getElementById('lista').innerHTML = entries.slice(0,8).map(e => `
      <div class="entry">
        <div class="entry-top">
          <span class="entry-date">${e.fecha}</span>
          <span class="entry-hours">${e.horas}h</span>
        </div>
        ${e.comentario ? `<div class="entry-comment">${e.comentario}</div>` : ''}
        <div class="entry-ts">Registrado: ${e.ahora}</div>
      </div>
    `).join('');
  } catch(e) { console.error(e); }
}

// Check for token in URL (after OAuth redirect) or session
const params = new URLSearchParams(window.location.search);
const urlToken = params.get('access_token');
const sessionToken = sessionStorage.getItem('gtoken');

if(urlToken){
  window.history.replaceState({}, document.title, '/');
  initApp(urlToken);
} else if(sessionToken){
  initApp(sessionToken);
}

setHoy();
</script>
</body>
</html>
